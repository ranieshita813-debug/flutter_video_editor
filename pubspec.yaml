name: flutter_video_editor
description: motionGr - Advanced Android video editor built with Flutter and NLE tools.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  photo_manager: ^3.11.0
  provider: ^6.1.2
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Regular.ttf
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
