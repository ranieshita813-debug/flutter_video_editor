name: flutter_video_editor
description: Advanced Android video editor foundation built with Flutter, inspired by CapCut and pro NLE tools.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
