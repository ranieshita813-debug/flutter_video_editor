name: flutter_video_editor
description: motionGr - Advanced Android video editor built with Flutter and NLE tools.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  crypto: ^3.0.3
  file_picker: ^8.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  xml: ^6.5.0
  path_drawing: ^1.0.1
  path_parsing: ^1.0.1
  vector_math: ^2.1.4
  google_fonts: ^8.2.1
  path: ^1.9.0
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  photo_manager: ^3.11.0
  provider: ^6.1.2
  video_player: ^2.8.2
  phosphor_icons: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/img/
    - assets/logo.svg
    - assets/logo_black.svg
    - assets/logo_white.svg
    
  shaders:
    - shaders/chromatic_aberration.frag
    - shaders/digital_glitch.frag
    - shaders/vhs_tape.frag
    - shaders/film_grain.frag
    - shaders/cinematic_vignette.frag
    - shaders/dream_bloom.frag
    - shaders/mosaic_pixelate.frag
    - shaders/liquid_wave.frag
    - shaders/cinematic_grade.frag
    - shaders/crisp_sharpen.frag
    - shaders/lens_distortion.frag
    - shaders/speed_zoom_blur.frag
    - shaders/light_leak.frag
    - shaders/text_gold_foil.frag
    - shaders/text_holographic.frag
    - shaders/text_glass_shine.frag
    - shaders/chroma_key.frag
    - shaders/vhs.frag
    - shaders/wave.frag
    - shaders/vignette.frag
    - shaders/convex_screen_pro.frag

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: Ubuntu Sans
      fonts:
        - asset: assets/fonts/UbuntuSans-Regular.ttf
        - asset: assets/fonts/UbuntuSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/UbuntuSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/UbuntuSans-Bold.ttf
          weight: 700
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/UbuntuSans-Regular.ttf
        - asset: assets/fonts/UbuntuSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/UbuntuSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/UbuntuSans-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Regular.ttf
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
